<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Circle Kabaddi Control</title>
<style>
*{box-sizing:border-box}body{font-family:'Segoe UI',Arial,sans-serif;background:#0d0d1a;color:#eee;margin:0;padding:12px;max-width:720px;margin:0 auto}
h1{text-align:center;color:#ffd700;font-size:22px}
.section{background:#16213e;border-radius:12px;padding:12px;margin:10px 0}
h2{color:#ffd700;margin:0 0 8px;text-align:center;font-size:16px}
.btns{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin:8px 0}
button{padding:12px;font-size:14px;font-weight:bold;border:none;border-radius:8px;cursor:pointer;color:#fff;background:#0984e3}
.plus{background:#00b894}.minus{background:#d63031}
input,textarea{width:100%;padding:8px;margin:4px 0;border-radius:6px;border:none;background:#222;color:#fff}
.status{text-align:center;color:#00b894;font-weight:bold;margin:8px 0}
.link{text-align:center;background:#1a1a2e;padding:10px;border-radius:8px;margin-top:10px;font-size:13px}
.link a{color:#ffd700}
</style>
</head>
<body>
<h1>Circle Kabaddi Broadcast Control</h1>

<div class="section">
  <h2>Graphics Scenes</h2>
  <div class="btns">
    <button onclick="showScene('opening')">Opening</button>
    <button onclick="showScene('lineupA')">Team A Lineup</button>
    <button onclick="showScene('lineupB')">Team B Lineup</button>
    <button onclick="showScene('vs')">VS Graphic</button>
    <button onclick="showScene('scoreboard')">Scoreboard</button>
    <button onclick="showScene('none')">Hide All</button>
  </div>
</div>

<div class="section">
  <h2>Match Info (Opening)</h2>
  <input id="ground" placeholder="Ground Name">
  <input id="matchTitle" placeholder="Match Title">
  <input id="matchInfo" placeholder="Match Information">
  <button onclick="updateMatchInfo()">Update Opening Info</button>
</div>

<div class="section">
  <h2>Team A</h2>
  <input id="nA" placeholder="Team A Name">
  <input id="lA" placeholder="Team A Logo URL">
  <textarea id="playersA" rows="4" placeholder="Players (one per line: Name|PhotoURL)"></textarea>
  <div class="btns"><button class="plus" onclick="chg('A',1)">+1</button><button class="minus" onclick="chg('A',-1)">-1</button></div>
</div>

<div class="section">
  <h2>Team B</h2>
  <input id="nB" placeholder="Team B Name">
  <input id="lB" placeholder="Team B Logo URL">
  <textarea id="playersB" rows="4" placeholder="Players (one per line: Name|PhotoURL)"></textarea>
  <div class="btns"><button class="plus" onclick="chg('B',1)">+1</button><button class="minus" onclick="chg('B',-1)">-1</button></div>
</div>

<div class="section">
  <h2>Timer: <span id="tDisp">20:00</span></h2>
  <div class="btns">
    <button onclick="socket.emit('timer',{action:'start'})">Start</button>
    <button onclick="socket.emit('timer',{action:'pause'})">Pause</button>
    <button onclick="socket.emit('timer',{action:'reset'})">Reset</button>
  </div>
</div>

<button style="width:100%;margin:8px 0" onclick="updateAll()">Update Teams & Players</button>
<button class="minus" style="width:100%" onclick="if(confirm('Reset scores?'))socket.emit('resetScores')">Reset Scores</button>
<div class="status" id="status">Connected</div>
<div class="link"><strong>Overlay Link:</strong><br><a id="ovLink" href="/overlay" target="_blank">/overlay</a></div>

<script src="/socket.io/socket.io.js"></script>
<script>
const socket=io();
const st=document.getElementById('status');
socket.on('connect',()=>st.textContent='Connected ✓');
socket.on('state',s=>{
  document.getElementById('tDisp').textContent=s.timer||'20:00';
  document.getElementById('nA').value=s.teamA.name||'';
  document.getElementById('nB').value=s.teamB.name||'';
  document.getElementById('lA').value=s.teamA.logo||'';
  document.getElementById('lB').value=s.teamB.logo||'';
  document.getElementById('ground').value=s.ground||'';
  document.getElementById('matchTitle').value=s.matchTitle||'';
  document.getElementById('matchInfo').value=s.matchInfo||'';
});
function showScene(scene){socket.emit('setScene',scene)}
function chg(t,d){socket.emit('updateScore',{team:t,delta:d})}
function updateMatchInfo(){
  socket.emit('updateMatchInfo',{
    ground:document.getElementById('ground').value,
    matchTitle:document.getElementById('matchTitle').value,
    matchInfo:document.getElementById('matchInfo').value
  });
}
function parsePlayers(text){
  return text.split('\n').filter(l=>l.trim()).map(l=>{
    const [name,img]=l.split('|').map(s=>s.trim());
    return {name:name||'',img:img||''};
  });
}
function updateAll(){
  socket.emit('updateTeams',{
    teamAName:document.getElementById('nA').value,
    teamBName:document.getElementById('nB').value,
    teamALogo:document.getElementById('lA').value,
    teamBLogo:document.getElementById('lB').value,
    teamAPlayers:parsePlayers(document.getElementById('playersA').value),
    teamBPlayers:parsePlayers(document.getElementById('playersB').value)
  });
  st.textContent='Updated!';
}
document.getElementById('ovLink').href=location.origin+'/overlay';
document.getElementById('ovLink').textContent=location.origin+'/overlay';
</script>
</body>
</html>
