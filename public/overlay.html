<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Circle Kabaddi Broadcast Overlay</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:transparent;font-family:'Segoe UI',Arial,sans-serif;overflow:hidden;height:100vh;color:#fff}
.hidden{display:none!important}
.scene{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;animation:fadeIn .6s ease}
@keyframes fadeIn{from{opacity:0;transform:scale(.9)}to{opacity:1;transform:scale(1)}}
@keyframes slideUp{from{transform:translateY(100px);opacity:0}to{transform:translateY(0);opacity:1}}
@keyframes slideIn{from{transform:translateX(-200px);opacity:0}to{transform:translateX(0);opacity:1}}

/* OPENING */
.opening{background:linear-gradient(135deg,rgba(10,10,40,.92),rgba(40,10,20,.92));text-align:center;padding:40px}
.opening h1{font-size:48px;color:#ffd700;text-shadow:0 4px 10px #000;margin-bottom:10px}
.opening h2{font-size:28px;margin:10px 0}
.opening p{font-size:20px;color:#ddd}

/* LINEUP */
.lineup{background:linear-gradient(135deg,rgba(15,15,35,.95),rgba(25,10,40,.95));padding:30px;width:90%;max-width:900px;border-radius:20px;border:4px solid #ffd700}
.lineup h2{text-align:center;color:#ffd700;font-size:32px;margin-bottom:20px}
.players{display:grid;grid-template-columns:repeat(4,1fr);gap:15px}
.player{background:rgba(0,0,0,.5);border-radius:12px;padding:10px;text-align:center;border:2px solid #ffd700;animation:slideUp .5s ease both}
.player img{width:80px;height:80px;border-radius:50%;object-fit:cover;border:3px solid #ffd700}
.player .pname{font-weight:bold;margin-top:6px;font-size:14px}

/* VS */
.vs-scene{background:linear-gradient(90deg,rgba(20,10,40,.95),rgba(40,10,20,.95));width:90%;max-width:1000px;display:flex;align-items:center;justify-content:space-around;padding:40px;border-radius:20px;border:4px solid #ffd700}
.vs-team{text-align:center;animation:slideIn .6s ease}
.vs-team img{width:120px;height:120px;border-radius:50%;object-fit:cover;border:4px solid #ffd700}
.vs-team h3{margin-top:10px;font-size:24px;color:#ffd700}
.vs-text{font-size:60px;font-weight:900;color:#fff;text-shadow:0 4px 8px #000}

/* SCOREBOARD */
.scoreboard{position:fixed;top:20px;right:20px;background:linear-gradient(135deg,rgba(10,10,30,.95),rgba(30,10,40,.95));border:3px solid #ffd700;border-radius:16px;padding:12px 18px;display:flex;align-items:center;gap:14px;min-width:480px;box-shadow:0 10px 30px rgba(0,0,0,.7)}
.team{display:flex;align-items:center;gap:10px}
.logo{width:50px;height:50px;border-radius:50%;object-fit:cover;border:3px solid #ffd700;background:#222}
.logo-ph{width:50px;height:50px;border-radius:50%;background:#333;display:flex;align-items:center;justify-content:center;font-weight:bold;border:3px solid #ffd700;color:#ffd700}
.name{font-weight:800;font-size:14px;text-transform:uppercase;max-width:90px;white-space:nowrap;overflow:hidden}
.score{font-size:44px;font-weight:900;color:#ffd700;text-shadow:2px 2px 6px #000;min-width:50px;text-align:center}
.vs-small{color:#aaa;margin:0 6px;font-weight:bold}
.timer-box{position:absolute;bottom:-24px;left:50%;transform:translateX(-50%);background:#000c;padding:3px 12px;border-radius:10px;font-size:13px;border:2px solid #ffd700}
</style>
</head>
<body>
<div id="opening" class="scene opening hidden">
  <div>
    <h1 id="groundName">Ground Name</h1>
    <h2 id="matchTitle">Circle Kabaddi Match</h2>
    <p id="matchInfo">Live Streaming</p>
  </div>
</div>

<div id="lineupA" class="scene lineup hidden">
  <div>
    <h2 id="teamATitle">TEAM A</h2>
    <div class="players" id="playersA"></div>
  </div>
</div>

<div id="lineupB" class="scene lineup hidden">
  <div>
    <h2 id="teamBTitle">TEAM B</h2>
    <div class="players" id="playersB"></div>
  </div>
</div>

<div id="vsScene" class="scene vs-scene hidden">
  <div class="vs-team">
    <img id="vsLogoA" src="" alt="">
    <h3 id="vsNameA">TEAM A</h3>
  </div>
  <div class="vs-text">VS</div>
  <div class="vs-team">
    <img id="vsLogoB" src="" alt="">
    <h3 id="vsNameB">TEAM B</h3>
  </div>
</div>

<div id="scoreboard" class="scoreboard hidden">
  <div class="team">
    <div id="logoA" class="logo-ph">A</div>
    <div class="name" id="nameA">TEAM A</div>
  </div>
  <div style="display:flex;align-items:center">
    <div class="score" id="scoreA">0</div>
    <div class="vs-small">-</div>
    <div class="score" id="scoreB">0</div>
  </div>
  <div class="team">
    <div class="name" id="nameB" style="text-align:right">TEAM B</div>
    <div id="logoB" class="logo-ph">B</div>
  </div>
  <div class="timer-box" id="timer">20:00</div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
const socket = io();
function hideAll(){
  document.querySelectorAll('.scene, .scoreboard').forEach(el=>el.classList.add('hidden'));
}
function setLogo(id,url,fb){
  const el=document.getElementById(id);
  if(!el)return;
  if(url){ if(el.tagName!=='IMG') el.outerHTML=`<img id="${id}" src="${url}" class="logo">`; else el.src=url; }
  else if(el.tagName==='IMG') el.outerHTML=`<div id="${id}" class="logo-ph">${fb}</div>`;
}
function renderPlayers(containerId, players){
  const c=document.getElementById(containerId);
  c.innerHTML='';
  (players||[]).forEach((p,i)=>{
    const div=document.createElement('div');
    div.className='player';
    div.style.animationDelay=(i*0.1)+'s';
    div.innerHTML=`<img src="${p.img||''}" alt=""><div class="pname">${p.name||'Player'}</div>`;
    c.appendChild(div);
  });
}
socket.on('state', s=>{
  hideAll();
  if(s.scene==='opening'){
    document.getElementById('groundName').textContent=s.ground||'Ground';
    document.getElementById('matchTitle').textContent=s.matchTitle||'Circle Kabaddi';
    document.getElementById('matchInfo').textContent=s.matchInfo||'';
    document.getElementById('opening').classList.remove('hidden');
  } else if(s.scene==='lineupA'){
    document.getElementById('teamATitle').textContent=s.teamA.name||'TEAM A';
    renderPlayers('playersA', s.teamA.players);
    document.getElementById('lineupA').classList.remove('hidden');
  } else if(s.scene==='lineupB'){
    document.getElementById('teamBTitle').textContent=s.teamB.name||'TEAM B';
    renderPlayers('playersB', s.teamB.players);
    document.getElementById('lineupB').classList.remove('hidden');
  } else if(s.scene==='vs'){
    document.getElementById('vsNameA').textContent=s.teamA.name||'TEAM A';
    document.getElementById('vsNameB').textContent=s.teamB.name||'TEAM B';
    document.getElementById('vsLogoA').src=s.teamA.logo||'';
    document.getElementById('vsLogoB').src=s.teamB.logo||'';
    document.getElementById('vsScene').classList.remove('hidden');
  } else if(s.scene==='scoreboard'){
    document.getElementById('scoreA').textContent=s.teamA.score;
    document.getElementById('scoreB').textContent=s.teamB.score;
    document.getElementById('nameA').textContent=s.teamA.name||'TEAM A';
    document.getElementById('nameB').textContent=s.teamB.name||'TEAM B';
    document.getElementById('timer').textContent=s.timer||'20:00';
    setLogo('logoA',s.teamA.logo,'A');
    setLogo('logoB',s.teamB.logo,'B');
    document.getElementById('scoreboard').classList.remove('hidden');
  }
});
</script>
</body>
</html>
